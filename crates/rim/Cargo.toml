[package]
name = "rim"
version = "0.1.0"
edition = "2024"
description = "Minimal terminal editor built on piece-tree"
license = "MIT"

[dependencies]
piece-tree = { path = "../piece-tree" }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
unicode-width = "0.2"
memchr = "2.8"
str_indices = "0.4.4"
base64 = "0.23"
terminal-colorsaurus = "1.0"
mimalloc = "0.1"
unicode-segmentation = "1.13.3"
tree-sitter = "0.27"
libloading = "0.9"
tree-sitter-language = "0.1"
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-lua = { version = "0.5", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
nucleo-matcher = "0.3.1"

[features]
default = ["grammars"]
# Grammars linked into the binary, the fallback when none is installed (see docs/reference/syntax.md).
grammars = [
    "lang-rust", "lang-python", "lang-javascript", "lang-typescript", "lang-tsx", "lang-c", "lang-cpp",
    "lang-markdown", "lang-toml", "lang-html", "lang-css", "lang-json", "lang-bash", "lang-lua",
]
lang-rust = ["dep:tree-sitter-rust"]
lang-python = ["dep:tree-sitter-python"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-typescript = ["dep:tree-sitter-typescript", "lang-javascript"]
lang-tsx = ["lang-typescript"]
lang-c = ["dep:tree-sitter-c"]
lang-cpp = ["dep:tree-sitter-cpp", "lang-c"]
lang-markdown = ["dep:tree-sitter-md"]
lang-toml = ["dep:tree-sitter-toml-ng"]
lang-html = ["dep:tree-sitter-html"]
lang-css = ["dep:tree-sitter-css"]
lang-json = ["dep:tree-sitter-json"]
lang-bash = ["dep:tree-sitter-bash"]
lang-lua = ["dep:tree-sitter-lua"]

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["event"] }
